# Viikoittainen katetarkistus (scripts/katetarkistus.mjs, laskenta api/_lib/kate.js): jos jokin näkyvä tuote on alle
# 20 % (myynnin raja) tai sen Printify-kulut ovat tuntemattomat, yhteenveto sähköpostilla osoitteeseen OMISTAJA_EMAIL.
# Salaisuudet (Settings > Secrets and variables > Actions), molemmat valinnaisia:
#   DATABASE_URL    tuotteet suoraan tietokannasta (näkee myös jo piilotetut alle 20 %:n tuotteet);
#                   ilman sitä tuotteet haetaan sivuston /api/products-rajapinnasta
#   RESEND_API_KEY  sähköposti; ilman sitä työ epäonnistuu ja yhteenveto näkyy lokissa
# Valinnaiset muuttujat (Variables): KAUPPA_URL (oletus https://huumorikauppa.fi), OMISTAJA_EMAIL, EMAIL_FROM.
# Salaisuuksia ei tulosteta. Ajastetut työnkulut ajetaan vain oletushaarasta (main).
name: Katetarkistus

on:
  schedule:
    - cron: "7 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Asenna tietokanta-ajuri (vain kun DATABASE_URL on asetettu)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then npm ci --omit=dev --ignore-scripts --no-audit --no-fund; else echo "DATABASE_URL puuttuu: tuotteet haetaan /api/products-rajapinnasta"; fi
      - name: Tarkista kate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          KAUPPA_URL: ${{ vars.KAUPPA_URL || 'https://huumorikauppa.fi' }}
          OMISTAJA_EMAIL: ${{ vars.OMISTAJA_EMAIL || 'huumorikauppa@gmail.com' }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
        run: node scripts/katetarkistus.mjs --url "$KAUPPA_URL"
