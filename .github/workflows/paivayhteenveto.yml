# Päivän yhteenveto omistajalle klo 7 Suomen aikaa (api/cron/tilaukset.js ?tehtava=yhteenveto, api/_lib/valvonta.js):
# eilisen tilaukset, myynti ja kate euroina, jumissa olevat tilaukset sekä kuukauden kate tavoitteeseen nähden.
# GitHubin ajastus on UTC-ajassa, joten työ ajetaan 04:00 ja 05:00 UTC: kesäajalla (UTC+3) 04:00 on klo 7 ja
# talviajalla (UTC+2) 05:00 on klo 7. Rajapinta lähettää vain, kun Helsingissä on kello 7, ja kv-avain estää toisen
# lähetyksen samana päivänä. Jos GitHub viivästyttää ajoa yli tunnin, tunnin välein ajettava tilausvalvonta lähettää
# yhteenvedon klo 9 jälkeen.
# Salaisuus: CRON_SECRET (sama kuin Vercelissä). Valinnainen muuttuja: KAUPPA_URL (oletus https://huumorikauppa.fi).
# Ajastetut työnkulut ajetaan vain oletushaarasta (main). Käsiajo (Run workflow) lähettää heti (pakota=1).
name: Päivän yhteenveto

on:
  schedule:
    - cron: "0 4 * * *"
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  yhteenveto:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Kutsu yhteenvetoa
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          KAUPPA_URL: ${{ vars.KAUPPA_URL || 'https://huumorikauppa.fi' }}
          PAKOTA: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET puuttuu, ohitetaan"; exit 0; fi
          koodi=$(curl -sS -o vastaus.json -w '%{http_code}' --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" "$KAUPPA_URL/api/cron/tilaukset?tehtava=yhteenveto&pakota=$PAKOTA")
          echo "HTTP $koodi"
          head -c 3000 vastaus.json; echo
          [ "$koodi" = "200" ]
